<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Only keep stdout logs
<filter service.**>
  @type grep
  <regexp>
    key source
    pattern ^stdout$
  </regexp>
</filter>

# Parse the JSON logs written by the dummy services
<filter service.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# Keep only mpesa_c2b flow
<filter service.**>
  @type grep
  <regexp>
    key flow
    pattern ^mpesa_c2b$
  </regexp>
</filter>

# Add marker showing the record was written to the file-based log server
<filter service.**>
  @type record_transformer
  <record>
    log_server option1-file-server
  </record>
</filter>

# Write all received logs to the mounted log server directory
<match service.**>
  @type file
  path /log-server/mpesac2btransactions
  append true
  <format>
    @type json
  </format>
  <buffer>
    @type file
    path /log-server/buffer/mpesac2b
    flush_mode interval
    flush_interval 5s
  </buffer>
</match>