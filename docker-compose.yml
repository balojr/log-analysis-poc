version: "3.9"

services:
  fluentd:
    image: fluent/fluentd:edge-debian
    container_name: fluentd
    user: "0:0"
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./log-server-storage:/log-server

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: transaction_monitoring
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped

  analyzer-service:
    image: python:3.12-alpine
    container_name: analyzer-service
    working_dir: /app
    volumes:
      - ./log-analyzer:/app
      - ./log-server-storage:/app/log-server-storage
    command: >
      sh -c "pip install --disable-pip-version-check --no-cache-dir -q -r requirements.txt &&
      python app.py"
    environment:
      DATABASE_URL: mysql+pymysql://root:!QAZ2wsx@51.158.118.41:32592/mulika-customer-profiling?charset=utf8mb4
      LOG_PATH_PATTERN: /app/log-server-storage/mpesac2btransactions*
      READER_POLL_INTERVAL_SECONDS: "2"
      WRITER_FLUSH_INTERVAL_SECONDS: "10"
    depends_on:
      - fluentd
    restart: unless-stopped

  stk-push-service:
    image: python:3.12-alpine
    container_name: stk-push-service
    working_dir: /app
    volumes:
      - ./services/stk-push-service:/app
    command: >
      sh -c "pip install --disable-pip-version-check --no-cache-dir -q redis &&
         python app.py"
    environment:
      FLOW: mpesa_c2b
      SERVICE_NAME: stk-push-service
      REDIS_HOST: redis
      CALLBACK_QUEUE: mpesa_callback_queue
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "service.stk_push"
    depends_on:
      - fluentd
      - redis

  mpesa-callback-service:
    image: python:3.12-alpine
    container_name: mpesa-callback-service
    working_dir: /app
    volumes:
      - ./services/mpesa-callback-service:/app
    command: >
      sh -c "pip install --disable-pip-version-check --no-cache-dir -q redis &&
         python app.py"
    environment:
      FLOW: mpesa_c2b
      SERVICE_NAME: mpesa-callback-service
      REDIS_HOST: redis
      INPUT_QUEUE: mpesa_callback_queue
      SUCCESS_QUEUE: credit_account_queue
      FAILURE_QUEUE: notification_queue
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "service.mpesa_callback"
    depends_on:
      - fluentd
      - redis

  credit-account-service:
    image: python:3.12-alpine
    container_name: credit-account-service
    working_dir: /app
    volumes:
      - ./services/credit-account-service:/app
    command: >
      sh -c "pip install --disable-pip-version-check --no-cache-dir -q redis &&
         python app.py"
      FLOW: mpesa_c2b
      SERVICE_NAME: credit-account-service
      REDIS_HOST: redis
      INPUT_QUEUE: credit_account_queue
      OUTPUT_QUEUE: notification_queue
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "service.credit_account"
    depends_on:
      - fluentd
      - redis

  notification-service:
    image: python:3.12-alpine
    container_name: notification-service
    working_dir: /app
    volumes:
      - ./services/notification-service:/app
    command: >
      sh -c "pip install --disable-pip-version-check --no-cache-dir -q redis &&
         python app.py"
    environment:
      FLOW: mpesa_c2b
      SERVICE_NAME: notification-service
      REDIS_HOST: redis
      INPUT_QUEUE: notification_queue
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "service.notification"
    depends_on:
      - fluentd
      - redis

volumes:
  postgres-data: